server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/achaarghar?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.error.include-message=always
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.jwt-secret=${JWT_SECRET:change-this-secret-change-this-secret-123456}
app.jwt-hours=72
app.public-url=${PUBLIC_URL:http://localhost:8080}
app.static-dir=${STATIC_DIR:../frontend}
# Local testing only: returns the reset code in the API reply so you can test without email. Keep false online.
app.expose-reset-code=${EXPOSE_RESET_CODE:false}
app.cors-origin=${CORS_ORIGIN:http://localhost:8080}
app.upload-dir=${UPLOAD_DIR:uploads}
app.admin-email=${ADMIN_EMAIL:admin@achaar.com}
app.admin-password=${ADMIN_PASSWORD:admin123}
app.free-shipping-over=750
app.shipping-fee=49

# Leave blank to use the built-in dummy payment. Set Razorpay TEST keys to use the real test gateway.
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

# Password-reset emails: with no SMTP settings the reset link is printed in the backend log instead.
# To send real email set SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD,
# SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true and SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true (see README).
